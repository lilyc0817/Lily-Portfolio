<!DocType html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
</head>

<body>
    <h1 class="">Task Manager!</h1>

    <form id="task-form">
        <input id="task-input" placeholder="Please write new task">
        <button type="submit">Enter</button>
    </form>

    <ol id="task-list">
        <li>
            <input type="checkbox">
            <span>Sleep</span>
            <button>Delete</button>
        </li>
    </ol>
    <script src="script.js"></script>
</body>

</html>
